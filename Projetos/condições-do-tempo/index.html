<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Condições do Tempo</title>
</head>

<body>
    <main class="container">
        <section class="pesquisar-cidade">
            <h1>Condições do Tempo</h1>
            <form class="formulario">
                <label for="cidade">Pesquise a sua cidade</label>
                <input type="search" name="cidade" id="cidade">
                <button type="submit" id="buscar">Buscar</button>
            </form>
        </section>

        <section class="info-clima">
            <div class="cidade-temp">
                <h2 class="cidade">Belo Horizonte</h2>
                <span class="temp">21°C</span>
            </div>
            <figure class="icone-clima">
                <img src="https://openweathermap.org/img/wn/02d@2x.png" alt="clima">
            </figure>

        </section>
    </main>

    <script src="./js/script.js"></script>
</body>

</html>
