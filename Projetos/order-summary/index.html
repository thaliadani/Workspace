<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./assets/styles/style.css">
  <title>Frontend Mentor | Order summary card</title>
</head>

<body>
  <main class="container">
    <img class="container__image" src="./assets/images/illustration-hero.svg"
      alt="A girl listening to a song and dancing">

    <h1 class="container__title">Order Summary</h1>
    <p class="container__text">You can now listen to millions of songs, audiobooks, and podcasts on any
      device anywhere you like!</p>

    <section class="container__plan">
      <img class="plan-image" src="./assets/images/icon-music.svg" alt="Icon music">
      <p class="plan-text"><span>Annual Plan</span>$59.99/year</p>
      <a class="plan-link" href="#">Change</a>
    </section>

    <button id="button-payment">Proceed to Payment</button>
    <button id="button-cancel"> Cancel Order</button>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/thaliadani">Thalia Danielle</a>.
  </footer>
</body>

</html>
