<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <main class="container">
        <section class="container__tabela">
            <h1>Tabela</h1>
                <table class="tabela">
                    <tr class="tabela-dados">
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>País</th>
                    </tr>
                    <tr class="tabela-dados">
                        <td>João</td>
                        <td>30</td>
                        <td>Brasil</td>
                    </tr>
                    <tr class="tabela-dados">
                        <td>Maria</td>
                        <td>25</td>
                        <td>Portugal</td>
                    </tr>
                </table>
            
        </section>
        
    </main>
    
</body>
</html>
