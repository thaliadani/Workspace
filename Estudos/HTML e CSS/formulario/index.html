<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/flexbox.css">
    <title>Formulário</title>
</head>
<body> 

    <main class="container">
        <section class="container__formulario">
            <h1>Exemplos de input</h1>
            <form class="formulario-exemplos" name="cadastro" method="post" target="_blank" autocomplete="on" onsubmit="alert('Enviado')" action="pages/example.html">

                <label class="exemplos-label" for="name">Nome</label>
                <input class="exemplos-input" type="text" name="name" id="name">

                <label class="exemplos-label" for="email">Email</label>
                <input class="exemplos-input" type="email" name="email" id="email">

                <label class="exemplos-label" for="senha">Senha</label>
                <input class="exemplos-input" type="password" name="senha" id="senha">

                <label class="exemplos-label" for="numero">Idade</label>
                <input class="exemplos-input" type="number" name="numero" id="numero" min="0" max="100" step="5">

                <label class="exemplos-label" for="telefone">Telefone</label>
                <input class="exemplos-input" type="tel" name="telefone" id="telefone">

                <label class="exemplos-label" for="date">Data</label>
                <input class="exemplos-input" type="date" name="name" id="date">

                <label class="exemplos-label" for="data-hora">Data e Hora</label>
                <input class="exemplos-input" type="datetime-local" name="data-hora" id="data-hora"> 

                <label class="exemplos-label" for="hora">Hora</label>
                <input class="exemplos-input" type="time" name="hora" id="hora">

                <label class="exemplos-label" for="semana">Semana</label>
                <input class="exemplos-input" type="week" name="semana" id="semana">

                <label class="exemplos-label" for="mes">Mês e Ano</label>
                <input class="exemplos-input" type="month" name="color" id="mes">

                <p>Checkboxes</p>
                <label  class="checkboxes" for="checkboxes">
                    <input class="exemplos-input checkboxes-input" type="checkbox" name="checkboxes[]" value="opção 1" id="checkbox">opção 1
                    <input class="exemplos-input checkboxes-input" type="checkbox" name="checkboxes[]" value="opção 2" id="checkbox">opção 2
                </label>    
                <p>Selecionar</p>
                <label class="selecionar" for="selecionar">
                    <input class="exemplos-input selecionar-input" type="radio" name="selecionar[]" value="sim" >Sim
                    <input class="exemplos-input selecionar-input" type="radio" name="selecionar[]" value="nao" >Nao
                </label>

                <label class="exemplos-label" for="hidden">Hidden</label>
                <input class="exemplos-input" type="hidden" name="hidden" id="hidden">

                <label class="exemplos-label" for="pesquisar">Barra de Pesquisa</label>
                <input class="exemplos-input" type="search" name="pesquisar" id="pesquisar">

                <label class="exemplos-label" for="color">Cor</label>
                <input class="exemplos-input" type="color" name="color" id="color">

                <label class="exemplos-label" for="s-arquivo">Arquivo</label>
                <input class="exemplos-input" type="file" name="arquivo" multiple id="s-arquivo">

                <label class="exemplos-label" for="range">Range</label>
                <input class="exemplos-input" type="range" name="range" id="range">

                <label class="exemplos-label" for="link">Url</label>
                <input class="exemplos-input" type="url" name="link" id="link">

                <label class="exemplos-label" for="imagem">Imagem</label>
                <input class="exemplos-input" type="image" src="imgs/submit-button.svg" alt="Submit" id="imagem">

                <div class="botoes">
                    <button class="botao-resetar" type="reset">Redefinir</button>
                    <button class="botao-enviar" type="submit">Enviar</button>
                </div>
            </form>    
        </section>

    </main>

</body>
</html>
