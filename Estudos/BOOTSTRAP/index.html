<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Login</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>

<body >
    <main class="background-city">
        <div class="container">
            <div class="row justify-content-center vh-100">
                <div class="col-10 col-sm-6 text-black m-4">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col text-center mt-5">
                                <figure>
                                    <img class="img-fluid w-50" src="./assets/imgs/logo.png" alt="logo">
                                </figure>
                            </div>

                        </div>

                        <div class="row">
                            <div class="col text-center mt-5 bg-white bg-opacity-25 rounded-3 pb-4 shadow">
                                <h1 class="p-4 fs-1 fw-bold">Login</h1>
                                <form action="./pages/inicio.html">
                                    <div class="mb-3 p-2">
                                        <label for="email" class="form-label fs-4">Email</label>
                                        <input type="email" name="email" class="form-control border-2 border-black"
                                            id="">
                                        <div class="form-text text-start text-dark">
                                            Nunca compartilharemos seu email com ninguém.
                                        </div>
                                    </div>
                                    <div class="mb-3 p-2">
                                        <label for="senha" class="form-label fs-4">Senha</label>
                                        <input type="password" name="senha" class="form-control  border-2 border-black"
                                            id="">
                                    </div>

                                    <button type="submit" class="btn btn-dark fs-4 fw-bold">Entrar</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
